<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Dashboard Remote Controller</title>
  <style>
    body { font-family: sans-serif; background: #121212; color: #fff; text-align: center; margin: 20px; }
    video { width: 90%; max-width: 600px; border: 2px solid #333; border-radius: 8px; background: #000; margin-top: 15px; }
    button { padding: 10px 15px; margin: 5px; cursor: pointer; border: none; border-radius: 4px; background: #007bff; color: white; font-weight: bold; }
    #qrcode { display: flex; justify-content: center; margin: 20px 0; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

  <h1>Dashboard Pengontrol</h1>
  <p>Scan QR Code ini menggunakan HP Target:</p>
  <div id="qrcode"></div>
  <p id="status">Menginisialisasi ID Session...</p>

  <video id="remoteVideo" autoplay playsinline controls></video>

  <div class="controls">
    <button onclick="sendCommand('cam-front')">Kamera Depan</button>
    <button onclick="sendCommand('cam-back')">Kamera Belakang</button>
    <button onclick="sendCommand('share-screen')">Minta Berbagi Layar</button>
  </div>

  <script>
    const peer = new Peer();
    let conn;

    peer.on('open', (id) => {
      document.getElementById('status').innerText = 'Menunggu koneksi dari HP Target...';
      const targetUrl = `${window.location.origin}/client?peerId=${id}`;
      
      new QRCode(document.getElementById("qrcode"), {
        text: targetUrl,
        width: 180,
        height: 180
      });
    });

    peer.on('connection', (c) => {
      conn = c;
      document.getElementById('status').innerText = 'HP Target terhubung!';
    });

    peer.on('call', (call) => {
      call.answer();
      call.on('stream', (remoteStream) => {
        document.getElementById('remoteVideo').srcObject = remoteStream;
      });
    });

    function sendCommand(cmd) {
      if (conn) {
        conn.send(cmd);
      } else {
        alert('HP Target belum terhubung!');
      }
    }
  </script>
</body>
</html>
