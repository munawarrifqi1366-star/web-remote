<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Remote Controller</title>
  <style>
    body { font-family: sans-serif; background: #121212; color: #fff; text-align: center; margin: 0; padding: 20px; }
    #qrcode { display: flex; justify-content: center; margin: 20px auto; padding: 10px; background: #fff; width: fit-content; border-radius: 8px; }
    video { width: 100%; max-width: 600px; border: 2px solid #333; border-radius: 8px; background: #000; margin-top: 15px; }
    button { padding: 10px 15px; margin: 5px; cursor: pointer; border: none; border-radius: 4px; background: #007bff; color: white; font-weight: bold; }
    button:hover { background: #0056b3; }
    .url-box { margin-top: 10px; font-size: 14px; word-break: break-all; color: #aaa; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

  <h1>Dashboard Pengontrol</h1>
  <p>Scan QR Code di bawah menggunakan HP Target:</p>
  
  <div id="qrcode"></div>
  <p class="url-box" id="urlText">Menggenerasi link...</p>
  <p id="status">Menginisialisasi ID Session...</p>

  <video id="remoteVideo" autoplay playsinline controls></video>

  <div class="controls">
    <button onclick="sendCommand('cam-front')">Kamera Depan</button>
    <button onclick="sendCommand('cam-back')">Kamera Belakang</button>
    <button onclick="sendCommand('share-screen')">Minta Berbagi Layar</button>
  </div>

  <script>
    let conn;
    const peer = new Peer();

    peer.on('open', (id) => {
      document.getElementById('status').innerText = 'Menunggu koneksi dari HP Target...';
      
      // Tentukan URL dasar (Mengatasi localhost)
      let baseUrl = window.location.origin;
      if (baseUrl.includes('localhost') || baseUrl.includes('127.0.0.1')) {
        // Ganti dengan IP lokal komputer Anda jika testing lokal (contoh: http://192.168.1.10:3000)
        // Jika sudah di Vercel, kondisi ini tidak akan terpicu.
      }

      const targetUrl = `${baseUrl}/client.html?peerId=${id}`;
      document.getElementById('urlText').innerText = targetUrl;
      
      // Reset elemen QR Code sebelum membuat baru
      const qrContainer = document.getElementById("qrcode");
      qrContainer.innerHTML = "";
      
      new QRCode(qrContainer, {
        text: targetUrl,
        width: 200,
        height: 200,
        correctLevel: QRCode.CorrectLevel.H
      });
    });

    peer.on('connection', (c) => {
      conn = c;
      document.getElementById('status').innerText = 'HP Target terhubung!';
    });

    peer.on('call', (call) => {
      call.answer();
      call.on('stream', (remoteStream) => {
        document.getElementById('remoteVideo').srcObject = remoteStream;
      });
    });

    function sendCommand(cmd) {
      if (conn) {
        conn.send(cmd);
      } else {
        alert('HP Target belum terhubung!');
      }
    }
  </script>
</body>
</html>
